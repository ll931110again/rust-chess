services:
  qualitydocs-api:
    type: web
    name: qualitydocs-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:/data/qualitydocs.db
      - key: PORT
        value: "8080"
    disk:
      name: qualitydocs-data
      mountPath: /data
      sizeGB: 1

  qualitydocs-web:
    type: web
    name: qualitydocs-web
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: qualitydocs-api
          type: web
          property: host
