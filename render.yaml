services:
  omnisearch-api:
    type: web
    name: omnisearch-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        value: sqlite:/data/omnisearch.db
      - key: PORT
        value: "8080"
    disk:
      name: omnisearch-data
      mountPath: /data
      sizeGB: 1

  omnisearch-web:
    type: web
    name: omnisearch-web
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: omnisearch-api
          type: web
          property: host
